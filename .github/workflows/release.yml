name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # sign provenance with the workflow's OIDC identity (Sigstore)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: a poisoned cache must not end up in a binary that runs as root.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o dist/boxwarden-linux-$arch ./cmd/boxwarden
          done
          cp install.sh dist/
          (cd dist && sha256sum boxwarden-linux-* install.sh > checksums.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
